<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>
        /* ===== RESET ===== */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* ===== HEADER ===== */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* ===== LOGIN BOX ===== */
        .login-container {
            width: 350px;
            background-color: white;
            margin: 80px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* ===== INPUT FIELDS ===== */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* ===== BUTTON ===== */
        button {
            width: 100%;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a252f;
        }

        /* ===== FOOTER ===== */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>My Website</h1>
    </header>

    <!-- LOGIN FORM -->
    <div class="login-container">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <button type="submit" href="https://www.youtube.com" >Login</button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
